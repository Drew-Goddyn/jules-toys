<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Toy Browser</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --text: #333;
      --border: #ccc;
      --highlight: #0070f3;
      --highlight-text: #fff;
      --card-bg: #fff;
      --sidebar-width: 400px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    #app {
      display: flex;
      flex-direction: row;
      width: 100%;
      height: 100%;
    }
    header {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    header h1 {
      font-size: 1.25rem;
    }
    .controls {
      display: flex;
      gap: 0.5rem;
    }
    input[type="text"], select {
      padding: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.9rem;
    }
    input[type="text"] {
      flex: 1;
    }
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      border-right: 1px solid var(--border);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 1rem;
      padding: 1rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: all 0.2s ease;
    }
    .card:hover {
      border-color: var(--highlight);
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .card.selected {
      border-color: var(--highlight);
      background: #eef6ff;
    }
    .card-tier {
      font-size: 0.75rem;
      color: #666;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }
    .card-name {
      font-size: 0.9rem;
      font-weight: 600;
    }
    .inspector {
      width: var(--sidebar-width);
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border);
    }
    .inspector-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .inspector-content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .iframe-container {
      flex: 1;
      position: relative;
      background: #eee;
    }
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #888;
      font-style: italic;
    }
    .open-link {
      display: inline-block;
      padding: 0.5rem 1rem;
      background: var(--highlight);
      color: var(--highlight-text);
      text-decoration: none;
      border-radius: 4px;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .open-link:hover {
      background: #005bb5;
    }
    @media (max-width: 768px) {
      #app {
        flex-direction: column;
      }
      .main-content {
        flex: 1;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .inspector {
        width: 100%;
        height: 50vh;
        border-left: none;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="main-content">
      <header>
        <h1>Live Toy Browser</h1>
        <div class="controls">
          <input type="text" id="search" placeholder="Search toys...">
          <select id="tier-filter">
            <option value="all">All Tiers</option>
            <option value="tier1">Tier 1</option>
            <option value="tier2">Tier 2</option>
            <option value="tier3">Tier 3</option>
            <option value="tier4">Tier 4</option>
            <option value="tier5">Tier 5</option>
            <option value="tier6">Tier 6</option>
            <option value="tier7">Tier 7</option>
            <option value="tier8">Tier 8</option>
          </select>
        </div>
      </header>
      <div class="grid" id="toy-grid">
        <!-- Cards injected here -->
      </div>
    </div>
    <div class="inspector">
      <div class="inspector-header">
        <div>
          <h2 id="inspector-name">Select a toy</h2>
          <div id="inspector-tier" class="card-tier"></div>
        </div>
        <a id="inspector-link" href="#" class="open-link" target="_blank" style="display: none;">Open Full</a>
      </div>
      <div class="inspector-content">
        <div class="iframe-container" id="iframe-container">
          <div class="placeholder">Preview will appear here</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const toys = [
      { id: 'forecast-tile', name: 'Forecast Tile', tier: 'tier1' },
      { id: 'passport-stamp', name: 'Passport Stamp', tier: 'tier1' },
      { id: 'signal-card', name: 'Signal Card', tier: 'tier1' },
      { id: 'migration-river', name: 'Migration River', tier: 'tier2' },
      { id: 'orchard-map', name: 'Orchard Map', tier: 'tier2' },
      { id: 'subway-cutaway', name: 'Subway Cutaway', tier: 'tier2' },
      { id: 'lunar-postcards', name: 'Lunar Postcards', tier: 'tier3' },
      { id: 'traffic-ballet', name: 'Traffic Ballet', tier: 'tier3' },
      { id: 'weather-console', name: 'Weather Console', tier: 'tier3' },
      { id: 'recipe-risk', name: 'Recipe Risk', tier: 'tier4' },
      { id: 'sequencer-map', name: 'Sequencer Map', tier: 'tier4' },
      { id: 'dream-vending', name: 'Dream Vending', tier: 'tier5' },
      { id: 'emotion-post-office', name: 'Emotion Post Office', tier: 'tier5' },
      { id: 'pocket-city', name: 'Pocket City', tier: 'tier5' },
      { id: 'catalogue-studio', name: 'Catalogue Studio', tier: 'tier6' },
      { id: 'incident-atlas', name: 'Incident Atlas', tier: 'tier6' },
      { id: 'kitchen-command', name: 'Kitchen Command', tier: 'tier6' },
      { id: 'market-algorithm', name: 'Market Algorithm', tier: 'tier7' },
      { id: 'rail-signal', name: 'Rail Signal', tier: 'tier7' },
      { id: 'reef-particles', name: 'Reef Particles', tier: 'tier7' },
      { id: 'biome-forge', name: 'Biome Forge', tier: 'tier8' },
      { id: 'orbital-foundry', name: 'Orbital Foundry', tier: 'tier8' },
      { id: 'salvage-run', name: 'Salvage Run', tier: 'tier8' }
    ];

    const grid = document.getElementById('toy-grid');
    const searchInput = document.getElementById('search');
    const tierFilter = document.getElementById('tier-filter');

    const inspectorName = document.getElementById('inspector-name');
    const inspectorTier = document.getElementById('inspector-tier');
    const inspectorLink = document.getElementById('inspector-link');
    const iframeContainer = document.getElementById('iframe-container');

    let selectedToyId = null;

    function renderGrid() {
      grid.innerHTML = '';
      const query = searchInput.value.toLowerCase();
      const tier = tierFilter.value;

      const filteredToys = toys.filter(toy => {
        const matchesSearch = toy.name.toLowerCase().includes(query);
        const matchesTier = tier === 'all' || toy.tier === tier;
        return matchesSearch && matchesTier;
      });

      filteredToys.forEach(toy => {
        const card = document.createElement('div');
        card.className = `card ${selectedToyId === toy.id ? 'selected' : ''}`;
        card.onclick = () => selectToy(toy);

        const tierLabel = document.createElement('div');
        tierLabel.className = 'card-tier';
        tierLabel.textContent = toy.tier;

        const nameLabel = document.createElement('div');
        nameLabel.className = 'card-name';
        nameLabel.textContent = toy.name;

        card.appendChild(tierLabel);
        card.appendChild(nameLabel);
        grid.appendChild(card);
      });
    }

    function selectToy(toy) {
      selectedToyId = toy.id;

      // Update inspector UI
      inspectorName.textContent = toy.name;
      inspectorTier.textContent = toy.tier;

      // Construct path relative to live-toy-browser
      const path = `../../${toy.tier}/${toy.id}/index.html`;

      inspectorLink.href = path;
      inspectorLink.style.display = 'inline-block';

      iframeContainer.innerHTML = `<iframe src="${path}"></iframe>`;

      renderGrid(); // Re-render to update selected state
    }

    searchInput.addEventListener('input', renderGrid);
    tierFilter.addEventListener('change', renderGrid);

    // Initial render
    renderGrid();
  </script>
</body>
</html>
