<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workspace Passport Stamp</title>
<style>
  :root {
    --bg-color: #cbd5e1;
    --card-bg: #f8fafc;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --stamp-red: #dc2626;
    --stamp-blue: #2563eb;
    --chip-bg: #e2e8f0;
    --chip-text: #1e293b;
    --border-color: #cbd5e1;
  }

  body {
    background-color: var(--bg-color);
    background-image:
      radial-gradient(circle at 10px 10px, rgba(0,0,0,0.03) 2px, transparent 0);
    background-size: 20px 20px;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-main);
  }

  .ticket-wrapper {
    position: relative;
    width: 440px;
    filter: drop-shadow(0 25px 35px rgba(0,0,0,0.15)) drop-shadow(0 5px 15px rgba(0,0,0,0.1));
  }

  .ticket {
    background:
      radial-gradient(circle at 0 60%, transparent 16px, var(--card-bg) 16.5px) left top / 51% 100% no-repeat,
      radial-gradient(circle at 100% 60%, transparent 16px, var(--card-bg) 16.5px) right top / 51% 100% no-repeat;
    border-radius: 16px;
    padding: 10px;
  }

  .ticket-inner {
    border: 2px dashed var(--border-color);
    border-radius: 12px;
    padding: 32px;
    position: relative;
    overflow: hidden;
  }

  .watermark {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-30deg);
    font-size: 7rem;
    font-weight: 900;
    color: rgba(15, 23, 42, 0.03);
    z-index: 0;
    pointer-events: none;
    letter-spacing: -0.05em;
    white-space: nowrap;
  }

  .content {
    position: relative;
    z-index: 1;
  }

  .header {
    text-align: center;
    margin-bottom: 32px;
  }

  .subtitle {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-weight: 700;
  }

  .destination {
    font-size: 2.75rem;
    font-weight: 900;
    margin: 0;
    letter-spacing: -0.03em;
    color: var(--text-main);
    text-transform: uppercase;
  }

  .route-info {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 24px;
    background: rgba(15, 23, 42, 0.03);
    padding: 16px 20px;
    border-radius: 8px;
    border: 1px solid rgba(15, 23, 42, 0.05);
  }

  .route-col {
    display: flex;
    flex-direction: column;
  }

  .route-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 6px;
    font-weight: 700;
  }

  .route-value {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--stamp-blue);
    letter-spacing: 0.05em;
  }

  .date-value {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text-main);
  }

  .divider-container {
    display: flex;
    align-items: center;
    margin: 28px -32px;
    position: relative;
  }

  .divider-line {
    flex-grow: 1;
    border-top: 2px dashed var(--border-color);
  }

  .chips-section {
    margin-top: 24px;
    margin-bottom: 32px;
  }

  .chips {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .chip {
    background: var(--chip-bg);
    border: 1px solid rgba(15, 23, 42, 0.1);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--chip-text);
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    letter-spacing: 0.02em;
  }

  .barcode {
    height: 40px;
    width: 60%;
    background: linear-gradient(to right,
      #0f172a 0%, #0f172a 3%,
      transparent 3%, transparent 5%,
      #0f172a 5%, #0f172a 6%,
      transparent 6%, transparent 9%,
      #0f172a 9%, #0f172a 12%,
      transparent 12%, transparent 14%,
      #0f172a 14%, #0f172a 15%,
      transparent 15%, transparent 18%,
      #0f172a 18%, #0f172a 22%,
      transparent 22%, transparent 24%,
      #0f172a 24%, #0f172a 26%,
      transparent 26%, transparent 28%,
      #0f172a 28%, #0f172a 31%,
      transparent 31%, transparent 34%,
      #0f172a 34%, #0f172a 35%,
      transparent 35%, transparent 38%,
      #0f172a 38%, #0f172a 42%,
      transparent 42%, transparent 44%,
      #0f172a 44%, #0f172a 48%,
      transparent 48%, transparent 50%,
      #0f172a 50%, #0f172a 53%,
      transparent 53%, transparent 55%,
      #0f172a 55%, #0f172a 58%,
      transparent 58%, transparent 62%,
      #0f172a 62%, #0f172a 64%,
      transparent 64%, transparent 66%,
      #0f172a 66%, #0f172a 70%,
      transparent 70%, transparent 72%,
      #0f172a 72%, #0f172a 75%,
      transparent 75%, transparent 78%,
      #0f172a 78%, #0f172a 81%,
      transparent 81%, transparent 84%,
      #0f172a 84%, #0f172a 86%,
      transparent 86%, transparent 88%,
      #0f172a 88%, #0f172a 91%,
      transparent 91%, transparent 94%,
      #0f172a 94%, #0f172a 96%,
      transparent 96%, transparent 98%,
      #0f172a 98%, #0f172a 100%
    );
    opacity: 0.8;
    margin-top: 10px;
  }

  /* Passport Stamp */
  .stamp-wrapper {
    position: absolute;
    bottom: -10px;
    right: -10px;
    pointer-events: none;
    z-index: 10;
  }

  .stamp {
    border: 4px solid var(--stamp-red);
    border-radius: 50%;
    width: 140px;
    height: 140px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: var(--stamp-red);
    font-weight: 800;
    text-transform: uppercase;
    position: relative;
    mix-blend-mode: multiply;
    opacity: 0.85;
    transform: rotate(-15deg);
    box-sizing: border-box;
    box-shadow: inset 0 0 0 2px rgba(220, 38, 38, 0.2);
  }

  .stamp::before {
    content: "";
    position: absolute;
    inset: 4px;
    border: 2px dotted var(--stamp-red);
    border-radius: 50%;
    opacity: 0.7;
  }

  .stamp::after {
    content: "";
    position: absolute;
    inset: -12px;
    border: 1px solid var(--stamp-red);
    border-radius: 50%;
    opacity: 0.3;
  }

  .stamp-top {
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    margin-bottom: 2px;
  }

  .stamp-mid {
    font-size: 1.5rem;
    margin: 4px 0;
    border-top: 2px solid var(--stamp-red);
    border-bottom: 2px solid var(--stamp-red);
    padding: 4px 0;
    width: 85%;
    text-align: center;
    letter-spacing: 0.05em;
    line-height: 1;
  }

  .stamp-bot {
    font-size: 0.65rem;
    letter-spacing: 0.05em;
    margin-top: 2px;
  }

  .stamp-date {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 0.6rem;
    position: absolute;
    bottom: 16px;
    opacity: 0.8;
  }
</style>
</head>
<body>

<div class="ticket-wrapper">
  <div class="ticket">
    <div class="ticket-inner">
      <div class="watermark">ORBITAL</div>

      <div class="content">
        <div class="header">
          <div class="subtitle">Workspace Product Launch</div>
          <h1 class="destination">ORBITAL-7</h1>
        </div>

        <div class="route-info">
          <div class="route-col">
            <span class="route-label">Route Code</span>
            <span class="route-value">XR-994A</span>
          </div>
          <div class="route-col" style="text-align: right;">
            <span class="route-label">Departure Date</span>
            <span class="date-value">NOV 14, 2024</span>
          </div>
        </div>

        <div class="divider-container">
          <div class="divider-line"></div>
        </div>

        <div class="chips-section">
          <div class="route-col" style="margin-bottom: 12px;">
            <span class="route-label">Eligibility Configuration</span>
          </div>

          <div class="chips">
            <span class="chip">Level 4 Access</span>
            <span class="chip">Beta Opt-In</span>
            <span class="chip">VIP Routing</span>
          </div>
        </div>

        <div class="barcode"></div>

        <div class="stamp-wrapper">
          <div class="stamp">
            <span class="stamp-top">VERIFIED</span>
            <span class="stamp-mid">APPROVED</span>
            <span class="stamp-bot">W-SPACE CMD</span>
            <span class="stamp-date">14-11-2024</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
