<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launch Forecast Tile</title>
  <style>
    :root {
      --bg-body: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-primary: #3b82f6;
      --accent-secondary: #60a5fa;
      --accent-glow: rgba(59, 130, 246, 0.4);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border: #334155;
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-body);
      font-family: var(--font-family);
      color: var(--text-main);
      padding: 20px;
    }

    .tile {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .title-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 0;
    }

    .phase-label {
      background-color: rgba(59, 130, 246, 0.15);
      color: var(--accent-secondary);
      border: 1px solid rgba(59, 130, 246, 0.3);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .score-section {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: -8px;
    }

    .score {
      font-size: 4rem;
      font-weight: 800;
      line-height: 1;
      margin: 0;
      letter-spacing: -0.03em;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .score-unit {
      font-size: 2rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .score-label {
      font-size: 0.875rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-top: 4px;
    }

    .meter-wrapper {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .meter-container {
      height: 8px;
      background-color: #0f172a;
      border-radius: 999px;
      position: relative;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .meter-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 87%;
      background: linear-gradient(90deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
      border-radius: 999px;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .meter-marker {
      position: absolute;
      top: -4px;
      bottom: -4px;
      width: 3px;
      background-color: #ffffff;
      left: 75%;
      border-radius: 2px;
      box-shadow: 0 0 6px rgba(0,0,0,0.8);
      z-index: 2;
    }

    .meter-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .divider {
      height: 1px;
      background-color: var(--border);
      width: 100%;
    }

    .forecast-range {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.875rem;
    }

    .forecast-label {
      color: var(--text-muted);
      font-weight: 500;
    }

    .forecast-value {
      font-weight: 600;
      color: var(--text-main);
      background-color: #0f172a;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .tags-section {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tag::before {
      content: "";
      display: block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .tag.high-risk {
      background-color: rgba(239, 68, 68, 0.1);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    .tag.high-risk::before { background-color: var(--danger); box-shadow: 0 0 4px var(--danger); }

    .tag.medium-risk {
      background-color: rgba(245, 158, 11, 0.1);
      color: #fcd34d;
      border: 1px solid rgba(245, 158, 11, 0.2);
    }
    .tag.medium-risk::before { background-color: var(--warning); box-shadow: 0 0 4px var(--warning); }

    .tag.low-risk {
      background-color: rgba(16, 185, 129, 0.1);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    .tag.low-risk::before { background-color: var(--success); box-shadow: 0 0 4px var(--success); }

  </style>
</head>
<body>

  <div class="tile">
    <div class="header">
      <div class="title-group">
        <h2 class="title">Launch Forecast</h2>
      </div>
      <div class="phase-label">Phase 3</div>
    </div>

    <div style="display: flex; flex-direction: column;">
      <div class="score-section">
        <h1 class="score">87<span class="score-unit">%</span></h1>
      </div>
      <div class="score-label">Confidence Score</div>
    </div>

    <div class="meter-wrapper">
      <div class="meter-container">
        <div class="meter-fill"></div>
        <div class="meter-marker"></div>
      </div>
      <div class="meter-labels">
        <span>0%</span>
        <span>TARGET: 75%</span>
        <span>100%</span>
      </div>
    </div>

    <div class="divider"></div>

    <div class="forecast-range">
      <span class="forecast-label">Expected Window</span>
      <span class="forecast-value">Q4 '23 – Q1 '24</span>
    </div>

    <div class="tags-section">
      <span class="tag high-risk">Supply Chain</span>
      <span class="tag medium-risk">Regulatory</span>
      <span class="tag low-risk">QA Passed</span>
    </div>
  </div>

</body>
</html>
