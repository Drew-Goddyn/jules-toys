name: Evaluate Pullfrog Experiment

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to evaluate
        required: true
      issue_number:
        description: Source experiment issue number
        required: true
      apply_labels:
        description: Apply the recommended experiment label
        required: true
        default: true
        type: boolean
      quality_threshold:
        description: Minimum judge score for experiment:accepted
        required: true
        default: "3"
      update_specimen_lab:
        description: Commit Specimen Lab data and deploy the static gallery
        required: true
        default: false
        type: boolean
  pull_request:
    types: [labeled]
    branches: ["main"]

permissions:
  contents: read

jobs:
  evaluate:
    name: Deterministic evaluation
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'pullfrog:evaluate')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      issue_number: ${{ steps.resolve.outputs.issue_number }}
      artifact_name: ${{ steps.resolve.outputs.artifact_name }}
      report_json: ${{ steps.report-output.outputs.report_json }}
    steps:
      - name: Resolve PR and issue
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_PR: ${{ inputs.pr_number }}
          DISPATCH_ISSUE: ${{ inputs.issue_number }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          pr_number="${DISPATCH_PR:-${EVENT_PR:-}}"
          if [ -z "$pr_number" ]; then
            echo "Could not resolve PR number" >&2
            exit 1
          fi

          metadata_file="$RUNNER_TEMP/pullfrog-pr-${pr_number}.json"
          gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json number,title,url,body,headRefName,headRefOid,baseRefName,files > "$metadata_file"

          issue_number="${DISPATCH_ISSUE:-}"
          if [ -z "$issue_number" ]; then
            issue_number="$(METADATA_FILE="$metadata_file" node --input-type=module -e 'import fs from "node:fs"; const metadata = JSON.parse(fs.readFileSync(process.env.METADATA_FILE, "utf8")); const match = String(metadata.body ?? "").match(/(?:issues\/|#)(\d+)/i); process.stdout.write(match ? match[1] : "");')"
          fi

          if [ -z "$issue_number" ]; then
            echo "Could not resolve source issue number" >&2
            exit 1
          fi

          {
            echo "pr_number=$pr_number"
            echo "issue_number=$issue_number"
            echo "metadata_file=$metadata_file"
            echo "checkout_ref=refs/pull/$pr_number/merge"
            echo "artifact_name=pullfrog-experiment-evaluation-$pr_number"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout evaluator source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: evaluator-source

      - name: Checkout PR merge ref
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve.outputs.checkout_ref }}
          path: pr-worktree

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: pr-worktree/package-lock.json

      - name: Install dependencies
        working-directory: pr-worktree
        run: npm ci

      - name: Run tests
        id: tests
        continue-on-error: true
        working-directory: pr-worktree
        run: npm test

      - name: Evaluate experiment
        working-directory: pr-worktree
        run: |
          node ../evaluator-source/scripts/evaluate-pullfrog-experiment.mjs \
            --pr-number "${{ steps.resolve.outputs.pr_number }}" \
            --issue-number "${{ steps.resolve.outputs.issue_number }}" \
            --metadata "${{ steps.resolve.outputs.metadata_file }}" \
            --test-outcome "${{ steps.tests.outcome }}" \
            --lineage-root ../evaluator-source \
            --output-dir pullfrog-evaluation \
            --report pullfrog-evaluation/report.json

      - name: Publish report output
        id: report-output
        working-directory: pr-worktree
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const report = fs.readFileSync("pullfrog-evaluation/report.json", "utf8"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `report_json<<PULLFROG_REPORT\n${report}\nPULLFROG_REPORT\n`);'

      - name: Upload evaluation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.resolve.outputs.artifact_name }}
          path: pr-worktree/pullfrog-evaluation/

  judge:
    name: Free-model judge
    needs: evaluate
    if: ${{ needs.evaluate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      judge_json: ${{ steps.pullfrog.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Judge experiment quality
        id: pullfrog
        uses: pullfrog/pullfrog@v0.1.30
        with:
          model: opencode/big-pickle
          push: disabled
          shell: disabled
          timeout: 20m
          prompt: |
            You are judging a Pullfrog-generated toy experiment in Drew-Goddyn/jules-toys.

            Source issue: #${{ needs.evaluate.outputs.issue_number }}
            Pull request: #${{ needs.evaluate.outputs.pr_number }}

            Deterministic evaluator report:
            ```json
            ${{ needs.evaluate.outputs.report_json }}
            ```

            Score only novelty, coherence, usefulness, and likely review burden. Do not override mechanical failures:
            failed tests, unexpected file scope, missing gallery registration, missing screenshot, external network dependency,
            and browser smoke failure must remain blockers.

            Return a concise JSON result matching the schema. Use quality_score 1-5.
          output_schema: |
            {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "quality_score",
                "acceptance_recommendation",
                "novelty",
                "coherence",
                "usefulness",
                "review_burden",
                "known_gaps",
                "rationale"
              ],
              "properties": {
                "quality_score": {
                  "type": "integer",
                  "minimum": 1,
                  "maximum": 5
                },
                "acceptance_recommendation": {
                  "type": "string",
                  "enum": ["accept", "needs-human-review", "reject"]
                },
                "novelty": {
                  "type": "string",
                  "minLength": 1
                },
                "coherence": {
                  "type": "string",
                  "minLength": 1
                },
                "usefulness": {
                  "type": "string",
                  "minLength": 1
                },
                "review_burden": {
                  "type": "string",
                  "minLength": 1
                },
                "known_gaps": {
                  "type": "array",
                  "items": {
                    "type": "string"
                  }
                },
                "rationale": {
                  "type": "string",
                  "minLength": 1
                }
              }
            }

  comment:
    name: Comment scorecard and label
    needs: [evaluate, judge]
    if: ${{ always() && needs.evaluate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    outputs:
      pr_comment_url: ${{ steps.scorecard.outputs.pr_comment_url }}
      issue_comment_url: ${{ steps.scorecard.outputs.issue_comment_url }}
      scorecard_marker: ${{ steps.scorecard.outputs.scorecard_marker }}
    steps:
      - name: Post scorecard
        id: scorecard
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ needs.evaluate.outputs.pr_number }}
          ISSUE_NUMBER: ${{ needs.evaluate.outputs.issue_number }}
          REPORT_JSON: ${{ needs.evaluate.outputs.report_json }}
          JUDGE_JSON: ${{ needs.judge.outputs.judge_json }}
          JUDGE_RESULT: ${{ needs.judge.result }}
          APPLY_LABELS: ${{ inputs.apply_labels || 'true' }}
          QUALITY_THRESHOLD: ${{ inputs.quality_threshold || '3' }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const report = JSON.parse(process.env.REPORT_JSON);
            const judge = process.env.JUDGE_JSON ? JSON.parse(process.env.JUDGE_JSON) : null;
            const threshold = Number(process.env.QUALITY_THRESHOLD || 3);
            const applyLabels = process.env.APPLY_LABELS === "true";
            const mechanicalPass = Boolean(report.recommendation?.mechanical_pass);
            const qualityScore = Number(judge?.quality_score);
            const judgeRejects = judge?.acceptance_recommendation === "reject";
            const qualityPasses = Number.isFinite(qualityScore) ? qualityScore >= threshold : true;
            const finalLabel = mechanicalPass && qualityPasses && !judgeRejects
              ? "experiment:accepted"
              : "experiment:failed";
            const extraLabels = judge?.acceptance_recommendation === "needs-human-review"
              ? ["needs-human-review"]
              : [];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const scorecardMarker = report.lineage?.scorecard_marker ?? `<!-- pullfrog-experiment-evaluator:v2 pr=${prNumber} issue=${issueNumber || "unknown"} -->`;
            const previousRuns = report.lineage?.previous_runs ?? [];

            function line(label, check, detail) {
              const status = check?.status ?? "unknown";
              return `- ${label}: ${status}${detail ? ` - ${detail}` : ""}`;
            }

            async function upsertScorecard(issueNumberForComment, body) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumberForComment,
                per_page: 100
              });
              const existing = comments.find((comment) => comment.body?.includes(scorecardMarker));
              if (existing) {
                const response = await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body
                });
                return response.data.html_url;
              }
              const response = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumberForComment,
                body
              });
              return response.data.html_url;
            }

            const scope = report.deterministic.changed_file_scope;
            const registration = report.deterministic.gallery_registration;
            const screenshot = report.deterministic.screenshot_presence;
            const network = report.deterministic.external_network_dependency;
            const smoke = report.deterministic.browser_smoke;
            const tests = report.deterministic.ci_test_result;
            const gaps = [
              ...(report.recommendation.known_gaps ?? []),
              ...(judge?.known_gaps ?? [])
            ];
            const labelNote = applyLabels
              ? `Applied/recommended label: \`${finalLabel}\``
              : `Recommended label: \`${finalLabel}\` (label application disabled)`;

            const body = [
              "## Pullfrog experiment evaluator scorecard v2",
              "",
              "Canonical v2 scorecard. Reruns update this comment in place and keep prior runs in lineage.",
              "",
              `PR: #${prNumber}`,
              `Source issue: #${issueNumber}`,
              `Workflow run: ${runUrl}`,
              `Report version: ${report.version}`,
              `Run sequence: ${report.lineage?.run_sequence ?? 1}`,
              previousRuns.length > 0
                ? `Previous runs: ${previousRuns.map((run) => run.run_url ? `[${run.run_id}](${run.run_url})` : run.run_id).join(", ")}`
                : "Previous runs: none recorded in Specimen Lab data",
              "",
              "### Mechanical checks",
              "",
              line("CI/test result", tests, tests.raw),
              line("Changed-file scope", scope, `${scope.changed_files.length} files; unexpected: ${scope.unexpected_files.length}`),
              line("Gallery registration", registration, registration.title ?? registration.reason),
              line("Screenshot presence", screenshot, `${screenshot.path ?? "none"}; PNG: ${screenshot.is_png === true}`),
              line("External network/dependency check", network, `${network.references.length} references; ${network.dynamic_apis.length} dynamic APIs`),
              line("Runtime/browser smoke", smoke, smoke.screenshot ?? smoke.reason),
              "",
              "### Free-model judge",
              "",
              judge
                ? `- Quality score: ${judge.quality_score}/5`
                : `- Quality score: unavailable; judge job result was ${process.env.JUDGE_RESULT}`,
              judge
                ? `- Recommendation: ${judge.acceptance_recommendation}`
                : "- Recommendation: unavailable",
              judge ? `- Novelty: ${judge.novelty}` : null,
              judge ? `- Coherence: ${judge.coherence}` : null,
              judge ? `- Usefulness: ${judge.usefulness}` : null,
              judge ? `- Review burden: ${judge.review_burden}` : null,
              judge ? `- Rationale: ${judge.rationale}` : null,
              "",
              "### Outcome",
              "",
              `Mechanical pass: ${mechanicalPass ? "yes" : "no"}`,
              labelNote,
              gaps.length > 0 ? `Known gaps: ${gaps.join("; ")}` : "Known gaps: none reported",
              "",
              scorecardMarker
            ].filter(Boolean).join("\n");

            const prCommentUrl = await upsertScorecard(prNumber, body);

            let issueCommentUrl = "";
            if (issueNumber && issueNumber !== prNumber) {
              issueCommentUrl = await upsertScorecard(issueNumber, body);
            }

            if (applyLabels) {
              const labels = [finalLabel, ...extraLabels];
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels
              });
              if (issueNumber && issueNumber !== prNumber) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels
                });
              }
            }

            core.setOutput("pr_comment_url", prCommentUrl);
            core.setOutput("issue_comment_url", issueCommentUrl);
            core.setOutput("scorecard_marker", scorecardMarker);

  persist-specimen-lab:
    name: Persist Specimen Lab data
    needs: [evaluate, judge, comment]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_specimen_lab == true && needs.evaluate.result == 'success' && needs.comment.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Refresh main
        run: git pull --ff-only origin main

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download evaluation artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.evaluate.outputs.artifact_name }}
          path: pullfrog-evaluation

      - name: Write judge result
        env:
          JUDGE_JSON: ${{ needs.judge.outputs.judge_json }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync("pullfrog-judge.json", `${process.env.JUDGE_JSON || "null"}\n`);'

      - name: Update Specimen Lab data
        run: |
          node scripts/update-specimen-lab-data.mjs \
            --report pullfrog-evaluation/report.json \
            --judge pullfrog-judge.json \
            --artifact-dir pullfrog-evaluation \
            --pr-comment-url "${{ needs.comment.outputs.pr_comment_url }}" \
            --issue-comment-url "${{ needs.comment.outputs.issue_comment_url }}" \
            --scorecard-marker "${{ needs.comment.outputs.scorecard_marker }}" \
            --artifact-name "${{ needs.evaluate.outputs.artifact_name }}" \
            --quality-threshold "${{ inputs.quality_threshold }}"

      - name: Validate static build with specimen data
        run: npm test

      - name: Commit Specimen Lab data
        run: |
          set -euo pipefail
          specimen_asset="public/specimen-lab/pullfrog/pr-${{ needs.evaluate.outputs.pr_number }}/browser-smoke.png"
          if git diff --quiet -- specimens/pullfrog/specimens.json "$specimen_asset"; then
            echo "No Specimen Lab data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specimens/pullfrog/specimens.json "$specimen_asset"
          git commit -m "Update Pullfrog Specimen Lab data for PR #${{ needs.evaluate.outputs.pr_number }}"
          git push origin HEAD:main

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy Specimen Lab
        id: deployment
        uses: actions/deploy-pages@v5
