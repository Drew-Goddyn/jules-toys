<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dream Vending Machine</title>
  <style>
    :root {
      --bg-color: #1a1a2e;
      --machine-bg: #16213e;
      --machine-accent: #0f3460;
      --text-color: #e94560;
      --glass-color: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.3);
      --dispense-glow: #e94560;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    #vending-machine {
      background-color: var(--machine-bg);
      border: 4px solid var(--machine-accent);
      border-radius: 20px;
      padding: 20px;
      width: 400px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(255, 255, 255, 0.1);
      position: relative;
      transition: transform 0.1s ease;
    }

    .shake {
      animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }

    #display-case {
      height: 200px;
      background: var(--glass-color);
      border: 2px solid var(--glass-border);
      border-radius: 10px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .ambient-glow {
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(233,69,96,0.5) 0%, rgba(0,0,0,0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.5;
      transition: opacity 0.5s ease;
    }

    #current-dream-visual {
      font-size: 60px;
      z-index: 1;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      transition: all 0.5s ease;
    }

    #control-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
      color: #ccc;
    }

    select {
      background-color: #000;
      color: var(--text-color);
      border: 1px solid var(--machine-accent);
      padding: 8px;
      font-family: inherit;
      border-radius: 5px;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--text-color);
    }

    #dispense-btn {
      grid-column: span 2;
      background-color: var(--machine-accent);
      color: #fff;
      border: none;
      padding: 15px;
      font-size: 18px;
      font-family: inherit;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    #dispense-btn:hover {
      background-color: #1a4f8f;
      box-shadow: 0 0 15px var(--dispense-glow);
    }

    #dispense-btn:active {
      transform: scale(0.98);
    }

    #dispense-btn::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 5px;
      height: 5px;
      background: rgba(255, 255, 255, 0.5);
      opacity: 0;
      border-radius: 100%;
      transform: scale(1, 1) translate(-50%);
      transform-origin: 50% 50%;
    }

    @keyframes ripple {
      0% { transform: scale(0, 0); opacity: 1; }
      20% { transform: scale(25, 25); opacity: 1; }
      100% { opacity: 0; transform: scale(40, 40); }
    }

    #dispense-btn.clicked::after {
      animation: ripple 1s ease-out;
    }

    #chute {
      margin-top: 20px;
      height: 60px;
      background-color: #000;
      border: 2px solid #333;
      border-radius: 5px 5px 20px 20px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .capsule {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      position: absolute;
      top: -50px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      transition: top 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      z-index: 2;
    }

    .capsule.dropped {
      top: 10px;
    }

    #receipt-container {
      position: absolute;
      top: 0;
      right: -250px;
      width: 220px;
      background-color: #fff;
      color: #000;
      padding: 15px;
      box-shadow: -5px 5px 15px rgba(0,0,0,0.3);
      font-size: 12px;
      transform: translateY(-100%);
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border-bottom: 2px dashed #ccc;
    }

    #receipt-container.printed {
      transform: translateY(20px);
    }

    .receipt-header {
      text-align: center;
      font-weight: bold;
      border-bottom: 1px dashed #000;
      padding-bottom: 5px;
      margin-bottom: 10px;
    }

    .receipt-line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    .receipt-footer {
      text-align: center;
      margin-top: 15px;
      font-style: italic;
      font-size: 10px;
    }

    #history {
      position: absolute;
      bottom: -150px;
      left: 0;
      right: 0;
      background: var(--machine-bg);
      border: 2px solid var(--machine-accent);
      border-radius: 0 0 20px 20px;
      padding: 10px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      transition: bottom 0.3s ease;
    }

    #history.show {
      bottom: -60px; /* Adjust based on container */
    }

    .history-item {
      font-size: 24px;
      min-width: 40px;
      text-align: center;
      cursor: help;
      position: relative;
    }

    .history-item:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: #000;
      color: #fff;
      padding: 5px;
      border-radius: 4px;
      font-size: 10px;
      white-space: nowrap;
      z-index: 10;
    }

    /* Small dots for 'processing' */
    .processing-dots::after {
      content: '.';
      animation: dots 1.5s steps(5, end) infinite;
    }

    @keyframes dots {
      0%, 20% { color: rgba(0,0,0,0); text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); }
      40% { color: white; text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); }
      60% { text-shadow: .25em 0 0 white, .5em 0 0 rgba(0,0,0,0); }
      80%, 100% { text-shadow: .25em 0 0 white, .5em 0 0 white; }
    }
  </style>
</head>
<body>

  <div id="vending-machine">
    <div id="receipt-container">
      <div class="receipt-header">DREAM VENDING INC.</div>
      <div id="receipt-body"></div>
      <div class="receipt-footer">No refunds on nightmares.</div>
    </div>

    <div id="display-case">
      <div class="ambient-glow" id="glow"></div>
      <div id="current-dream-visual">🌌</div>
    </div>

    <div id="control-panel">
      <div class="control-group">
        <label for="mood">Mood</label>
        <select id="mood">
          <option value="lucid" data-emoji="👁️">Lucid</option>
          <option value="nostalgic" data-emoji="📼">Nostalgic</option>
          <option value="surreal" data-emoji="🫠">Surreal</option>
          <option value="fever" data-emoji="🤒">Feverish</option>
        </select>
      </div>

      <div class="control-group">
        <label for="texture">Texture</label>
        <select id="texture">
          <option value="silky">Silky</option>
          <option value="crunchy">Crunchy</option>
          <option value="viscous">Viscous</option>
          <option value="geometric">Geometric</option>
        </select>
      </div>

      <div class="control-group">
        <label for="rarity">Rarity</label>
        <select id="rarity">
          <option value="common">Common</option>
          <option value="uncommon">Uncommon</option>
          <option value="epic">Epic</option>
          <option value="mythic">Mythic</option>
        </select>
      </div>

      <div class="control-group">
        <label for="payment">Payment Oddity</label>
        <select id="payment">
          <option value="memory">A fond memory</option>
          <option value="secret">A dark secret</option>
          <option value="button">A linty button</option>
          <option value="time">3 minutes of time</option>
        </select>
      </div>

      <button id="dispense-btn">Dispense Dream</button>
    </div>

    <div id="chute">
      <!-- Capsules drop here -->
    </div>

    <div id="history">
      <!-- History items appear here -->
    </div>
  </div>

  <script>
    const dispenseBtn = document.getElementById('dispense-btn');
    const machine = document.getElementById('vending-machine');
    const chute = document.getElementById('chute');
    const visual = document.getElementById('current-dream-visual');
    const glow = document.getElementById('glow');
    const receiptContainer = document.getElementById('receipt-container');
    const receiptBody = document.getElementById('receipt-body');
    const historyContainer = document.getElementById('history');

    const moodSelect = document.getElementById('mood');
    const textureSelect = document.getElementById('texture');
    const raritySelect = document.getElementById('rarity');
    const paymentSelect = document.getElementById('payment');

    let isDispensing = false;
    let dreamCount = 0;

    // Update display case instantly when mood changes
    moodSelect.addEventListener('change', (e) => {
      const selectedOption = e.target.options[e.target.selectedIndex];
      visual.textContent = selectedOption.dataset.emoji;
      updateGlow();
    });

    // Update colors based on selection
    function updateGlow() {
      const moodColors = {
        lucid: '#00f2fe',
        nostalgic: '#f6d365',
        surreal: '#a18cd1',
        fever: '#ff0844'
      };
      const mood = moodSelect.value;
      glow.style.background = `radial-gradient(circle, ${moodColors[mood]} 0%, rgba(0,0,0,0) 70%)`;
      document.documentElement.style.setProperty('--dispense-glow', moodColors[mood]);
    }

    updateGlow(); // Initial setup

    dispenseBtn.addEventListener('click', function(e) {
      if (isDispensing) return;
      isDispensing = true;

      // Button ripple effect
      this.classList.remove('clicked');
      void this.offsetWidth; // trigger reflow
      this.classList.add('clicked');
      this.textContent = 'Processing';
      this.classList.add('processing-dots');

      const selections = {
        mood: moodSelect.value,
        texture: textureSelect.value,
        rarity: raritySelect.value,
        payment: paymentSelect.options[paymentSelect.selectedIndex].text,
        emoji: moodSelect.options[moodSelect.selectedIndex].dataset.emoji
      };

      // Reset previous state
      chute.innerHTML = '';
      receiptContainer.classList.remove('printed');

      // 1. Shake machine
      machine.classList.add('shake');
      visual.style.transform = 'scale(1.5) rotate(10deg)';

      setTimeout(() => {
        machine.classList.remove('shake');
        visual.style.transform = 'scale(1) rotate(0deg)';

        // 2. Drop capsule
        const capsule = document.createElement('div');
        capsule.className = 'capsule';

        // Style capsule based on rarity
        const rarityGradients = {
          common: 'linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%)',
          uncommon: 'linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%)',
          epic: 'linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%)',
          mythic: 'linear-gradient(135deg, #ff0844 0%, #ffb199 100%)'
        };
        capsule.style.background = rarityGradients[selections.rarity];
        capsule.textContent = selections.emoji;

        chute.appendChild(capsule);

        // Trigger reflow to start animation
        void capsule.offsetWidth;
        capsule.classList.add('dropped');

        // 3. Print Receipt
        generateReceipt(selections);
        setTimeout(() => {
          receiptContainer.classList.add('printed');
        }, 300);

        // 4. Add to history
        addToHistory(selections);

        // Reset button
        setTimeout(() => {
          this.textContent = 'Dispense Dream';
          this.classList.remove('processing-dots');
          isDispensing = false;
        }, 1000);

      }, 500);
    });

    function generateReceipt(s) {
      const id = Math.random().toString(36).substring(2, 9).toUpperCase();
      const date = new Date().toLocaleTimeString();

      receiptBody.innerHTML = `
        <div class="receipt-line"><span>ID:</span> <span>#${id}</span></div>
        <div class="receipt-line"><span>Time:</span> <span>${date}</span></div>
        <hr style="border: 0; border-bottom: 1px dashed #ccc; margin: 5px 0;">
        <div class="receipt-line"><span>Mood:</span> <span>${s.mood}</span></div>
        <div class="receipt-line"><span>Texture:</span> <span>${s.texture}</span></div>
        <div class="receipt-line"><span>Rarity:</span> <span>${s.rarity}</span></div>
        <hr style="border: 0; border-bottom: 1px dashed #ccc; margin: 5px 0;">
        <div class="receipt-line"><span>Paid w/:</span></div>
        <div style="text-align: right; font-size: 10px;">${s.payment}</div>
      `;
    }

    function addToHistory(s) {
      dreamCount++;
      if (dreamCount === 1) {
        historyContainer.style.bottom = '-50px'; // Reveal shelf on first dispense
      }

      const item = document.createElement('div');
      item.className = 'history-item';
      item.textContent = s.emoji;
      item.dataset.tooltip = `${s.rarity} ${s.mood}`;

      historyContainer.prepend(item);

      // Keep only last 8
      if (historyContainer.children.length > 8) {
        historyContainer.removeChild(historyContainer.lastChild);
      }
    }
  </script>
</body>
</html>
