<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading... with Physics!</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #container {
            position: relative;
            width: 300px;
            height: 400px;
            border: 4px solid #444;
            border-radius: 12px;
            border-top: none;
            background-color: #222;
            overflow: hidden;
            cursor: grab;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #container:active {
            cursor: grabbing;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let container handle mouse events */
        }

        .ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            pointer-events: none;
            mix-blend-mode: exclusion;
        }

        .title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        .percentage {
            font-size: 4rem;
            font-weight: 800;
        }

        .subtitle {
            margin-top: 20px;
            font-size: 1rem;
            opacity: 0.6;
            text-align: center;
            max-width: 300px;
            line-height: 1.4;
        }

        .finished {
            display: none;
            font-size: 1.8rem;
            font-weight: bold;
            color: #4CAF50;
        }
    </style>
</head>
<body>

    <div id="container">
        <div class="ui">
            <div class="title" id="title">LOADING</div>
            <div class="percentage" id="perc">0%</div>
            <div class="finished" id="done">READY</div>
        </div>
        <canvas id="canvas" width="300" height="400"></canvas>
    </div>

    <div class="subtitle">Drag and throw the loading particles to pass the time!</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const percEl = document.getElementById('perc');
        const doneEl = document.getElementById('done');
        const titleEl = document.getElementById('title');
        const container = document.getElementById('container');

        const width = 300;
        const height = 400;

        // Physics constants
        const GRAVITY = 0.4;
        const BOUNCE = 0.6;
        const FRICTION = 0.98;
        const BALL_RADIUS = 10;

        let balls = [];
        let maxBalls = 100;
        let droppedBalls = 0;

        // Dragging state
        let isDragging = false;
        let dragBall = null;
        let lastMousePos = { x: 0, y: 0 };
        let mouseVel = { x: 0, y: 0 };

        class Ball {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = 0;
                this.radius = BALL_RADIUS;
                this.color = color;
                this.mass = 1;
            }

            update() {
                if (dragBall === this) return;

                this.vy += GRAVITY;
                this.vx *= FRICTION;
                this.vy *= FRICTION;

                this.x += this.vx;
                this.y += this.vy;

                // Bounds
                if (this.x - this.radius < 0) {
                    this.x = this.radius;
                    this.vx *= -BOUNCE;
                } else if (this.x + this.radius > width) {
                    this.x = width - this.radius;
                    this.vx *= -BOUNCE;
                }

                if (this.y + this.radius > height) {
                    this.y = height - this.radius;
                    this.vy *= -BOUNCE;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        function spawnBall() {
            if (droppedBalls < maxBalls) {
                // Gradient from red (0) to yellow to green (120)
                const hue = (droppedBalls / maxBalls) * 120;
                const color = `hsl(${hue}, 80%, 60%)`;

                // Spawn randomly at the top
                balls.push(new Ball(Math.random() * (width - 40) + 20, -20, color));
                droppedBalls++;

                percEl.innerText = `${droppedBalls}%`;

                if (droppedBalls === maxBalls) {
                    setTimeout(() => {
                        percEl.style.display = 'none';
                        titleEl.style.display = 'none';
                        doneEl.style.display = 'block';
                    }, 500);
                }
            }
        }

        function handleCollisions() {
            // A simpler, faster spatial partitioning or brute force since N=100
            for (let i = 0; i < balls.length; i++) {
                for (let j = i + 1; j < balls.length; j++) {
                    let b1 = balls[i];
                    let b2 = balls[j];

                    let dx = b2.x - b1.x;
                    let dy = b2.y - b1.y;
                    let distSq = dx * dx + dy * dy;
                    let minDist = b1.radius + b2.radius;

                    if (distSq < minDist * minDist) {
                        let dist = Math.sqrt(distSq);
                        if (dist === 0) continue; // avoid division by zero

                        let angle = Math.atan2(dy, dx);
                        let tx = b1.x + Math.cos(angle) * minDist;
                        let ty = b1.y + Math.sin(angle) * minDist;

                        let ax = (tx - b2.x) * 0.5;
                        let ay = (ty - b2.y) * 0.5;

                        // Resolve overlap
                        if (dragBall !== b1) {
                            b1.x -= ax;
                            b1.y -= ay;
                        }
                        if (dragBall !== b2) {
                            b2.x += ax;
                            b2.y += ay;
                        }

                        // Exchange momentum
                        let nx = dx / dist;
                        let ny = dy / dist;
                        let p = 2 * (b1.vx * nx + b1.vy * ny - b2.vx * nx - b2.vy * ny) / (b1.mass + b2.mass);

                        // Adding some damping to the collision
                        let damping = 0.8;
                        if (dragBall !== b1) {
                            b1.vx -= p * b2.mass * nx * damping;
                            b1.vy -= p * b2.mass * ny * damping;
                        }
                        if (dragBall !== b2) {
                            b2.vx += p * b1.mass * nx * damping;
                            b2.vy += p * b1.mass * ny * damping;
                        }
                    }
                }
            }
        }

        function loop() {
            ctx.clearRect(0, 0, width, height);

            handleCollisions();

            balls.forEach(ball => {
                ball.update();
                ball.draw();
            });

            requestAnimationFrame(loop);
        }

        // Spawn a ball every 80ms to make it ~8 seconds wait
        setInterval(spawnBall, 80);

        loop();

        // Mouse interactions
        function getMousePos(e) {
            const rect = container.getBoundingClientRect();
            // handle touch and mouse
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startDrag(e) {
            e.preventDefault();
            const pos = getMousePos(e);
            lastMousePos = pos;

            // Find closest ball
            for (let i = balls.length - 1; i >= 0; i--) {
                let ball = balls[i];
                let dx = pos.x - ball.x;
                let dy = pos.y - ball.y;
                if (Math.sqrt(dx * dx + dy * dy) <= ball.radius + 15) { // generous hitbox
                    isDragging = true;
                    dragBall = ball;
                    break;
                }
            }
        }

        function moveDrag(e) {
            if (!isDragging || !dragBall) return;
            e.preventDefault();
            const pos = getMousePos(e);

            mouseVel.x = pos.x - lastMousePos.x;
            mouseVel.y = pos.y - lastMousePos.y;

            dragBall.x = pos.x;
            dragBall.y = pos.y;

            lastMousePos = pos;
        }

        function endDrag(e) {
            if (isDragging && dragBall) {
                // Apply throw velocity
                dragBall.vx = mouseVel.x * 0.8;
                dragBall.vy = mouseVel.y * 0.8;
            }
            isDragging = false;
            dragBall = null;
        }

        container.addEventListener('mousedown', startDrag);
        container.addEventListener('mousemove', moveDrag);
        window.addEventListener('mouseup', endDrag);

        container.addEventListener('touchstart', startDrag, {passive: false});
        container.addEventListener('touchmove', moveDrag, {passive: false});
        window.addEventListener('touchend', endDrag);

    </script>
</body>
</html>
