<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Wrap Loader</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 100%;
            max-width: 800px;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
        }

        h1 {
            margin: 0;
            color: #1e293b;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #64748b;
            font-size: 16px;
            margin-top: 8px;
            font-weight: 500;
        }

        .progress-text {
            font-variant-numeric: tabular-nums;
            font-weight: 800;
            color: #38bdf8;
            display: inline-block;
            min-width: 80px;
            text-align: right;
        }

        .bubble-wrap-container {
            position: relative;
        }

        .bubble-wrap {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 12px;
            padding: 24px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 32px;
            box-shadow:
                0 20px 25px -5px rgba(0, 0, 0, 0.05),
                0 8px 10px -6px rgba(0, 0, 0, 0.01),
                inset 0 2px 4px rgba(255, 255, 255, 0.8);
            border: 2px solid #e2e8f0;
            backdrop-filter: blur(10px);
        }

        @media (max-width: 600px) {
            .bubble-wrap {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        .bubble {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e0f2fe 0%, #7dd3fc 100%);
            box-shadow:
                inset -3px -3px 8px rgba(0,0,0,0.1),
                inset 3px 3px 10px rgba(255,255,255,0.9),
                0 6px 8px rgba(0,0,0,0.06);
            cursor: pointer;
            position: relative;
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .bubble::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 12px;
            width: 14px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            transform: rotate(-30deg);
            filter: blur(0.5px);
        }

        .bubble:hover:not(.popped) {
            transform: scale(1.08);
            box-shadow:
                inset -3px -3px 8px rgba(0,0,0,0.1),
                inset 3px 3px 10px rgba(255,255,255,0.9),
                0 10px 15px rgba(0,0,0,0.1);
        }

        .bubble:active:not(.popped) {
            transform: scale(0.92);
        }

        .bubble.popped {
            background: rgba(224, 242, 254, 0.3);
            box-shadow:
                inset 2px 2px 4px rgba(0,0,0,0.05),
                inset -2px -2px 4px rgba(255,255,255,0.6);
            cursor: default;
            transform: scale(0.85);
            border: 1px solid rgba(125, 211, 252, 0.2);
        }

        .bubble.popped::after {
            display: none;
        }

        /* Particle effects for popping */
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #7dd3fc;
            pointer-events: none;
            opacity: 0;
        }

        .hint {
            font-size: 15px;
            color: #94a3b8;
            font-style: italic;
            transition: opacity 0.3s;
            height: 22px;
        }

        .complete-message {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            color: #10b981;
            font-weight: 700;
            font-size: 20px;
            white-space: nowrap;
            background: #d1fae5;
            padding: 8px 24px;
            border-radius: 999px;
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.1);
        }

        .complete-message.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .finished-header {
            color: #10b981;
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="title">Loading... <span class="progress-text" id="progress">0%</span></h1>
            <div class="subtitle" id="subtitle">Preparing virtual environment</div>
        </div>

        <div class="bubble-wrap-container">
            <div class="bubble-wrap" id="bubble-wrap">
                <!-- Bubbles generated by JS -->
            </div>
            <div class="complete-message" id="complete-message">Ready to go! 🎉</div>
        </div>

        <div class="hint" id="hint">Impatience? Pop them yourself to speed it up!</div>
    </div>

    <script>
        const TOTAL_BUBBLES = 30; // 3 rows of 10
        const AUTO_POP_INTERVAL = 800; // ms
        let poppedCount = 0;
        let autoPopTimer = null;
        let isComplete = false;
        let audioCtx = null;

        const bubbleWrapEl = document.getElementById('bubble-wrap');
        const progressEl = document.getElementById('progress');
        const titleEl = document.getElementById('title');
        const completeMessageEl = document.getElementById('complete-message');
        const hintEl = document.getElementById('hint');

        // Setup grid dynamically based on total bubbles
        const columns = window.innerWidth <= 600 ? 5 : 10;
        const rows = Math.ceil(TOTAL_BUBBLES / columns);

        // Update total bubbles if needed for perfect grid
        const actualTotal = rows * columns;

        function playPopSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                // Slightly randomize pitch for variety
                const baseFreq = 700 + Math.random() * 200;

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(baseFreq / 3, audioCtx.currentTime + 0.08);

                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.1);
            } catch (e) {
                // Ignore audio errors
            }
        }

        function createParticles(x, y) {
            const container = document.body;
            for (let i = 0; i < 6; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                container.appendChild(particle);

                const angle = Math.random() * Math.PI * 2;
                const velocity = 20 + Math.random() * 30;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;

                particle.animate([
                    { transform: 'translate(-50%, -50%) scale(1)', opacity: 0.8 },
                    { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0)`, opacity: 0 }
                ], {
                    duration: 300 + Math.random() * 200,
                    easing: 'cubic-bezier(0, .9, .57, 1)'
                }).onfinish = () => particle.remove();
            }
        }

        function updateProgress() {
            const percentage = Math.round((poppedCount / TOTAL_BUBBLES) * 100);
            progressEl.textContent = `${percentage}%`;

            if (poppedCount === TOTAL_BUBBLES && !isComplete) {
                isComplete = true;
                clearInterval(autoPopTimer);
                completeMessageEl.classList.add('show');
                hintEl.style.opacity = '0';

                titleEl.innerHTML = 'Complete! <span class="progress-text" style="color: #10b981;">100%</span>';
                document.getElementById('subtitle').textContent = 'Environment successfully initialized';
            }
        }

        function popBubble(bubble, event, isUserInteraction = false) {
            if (bubble.classList.contains('popped') || isComplete) return;

            bubble.classList.add('popped');
            poppedCount++;

            if (isUserInteraction) {
                playPopSound();
                if (event) {
                    const rect = bubble.getBoundingClientRect();
                    const x = event.clientX || (event.touches && event.touches[0].clientX) || (rect.left + rect.width / 2);
                    const y = event.clientY || (event.touches && event.touches[0].clientY) || (rect.top + rect.height / 2);
                    createParticles(x, y);
                }
            } else {
                // Occasional quiet pop sound for auto-pop if audio is ready
                if (audioCtx && audioCtx.state === 'running' && Math.random() > 0.5) {
                     playPopSound();
                }
            }

            updateProgress();
        }

        function autoPop() {
            if (isComplete) return;

            const unpopped = Array.from(document.querySelectorAll('.bubble:not(.popped)'));
            if (unpopped.length > 0) {
                // Auto pop from left to right (first unpopped)
                popBubble(unpopped[0], null, false);
            }
        }

        // Initialize bubbles
        for (let i = 0; i < TOTAL_BUBBLES; i++) {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            // Mouse events
            bubble.addEventListener('mousedown', (e) => popBubble(bubble, e, true));

            // Touch events
            bubble.addEventListener('touchstart', (e) => {
                e.preventDefault();
                popBubble(bubble, e, true);
            }, { passive: false });

            bubbleWrapEl.appendChild(bubble);
        }

        // Start auto-pop
        autoPopTimer = setInterval(autoPop, AUTO_POP_INTERVAL);
    </script>
</body>
</html>
