<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPT-5 Tideprint Studio</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101417;
      --panel: #172025;
      --panel-2: #1d292f;
      --ink: #f3f7f4;
      --muted: #9dadad;
      --line: #314045;
      --accent: #60d394;
      --accent-2: #f7cb6b;
      --danger: #ff6b6b;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      overflow: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-2);
      color: var(--ink);
      cursor: pointer;
      font-weight: 700;
    }

    button:hover { border-color: var(--accent); }
    button.primary { background: #1d5f45; border-color: #2f9168; }
    button.warn { color: #191410; background: var(--accent-2); border-color: var(--accent-2); }

    .app {
      display: grid;
      grid-template-columns: 300px minmax(360px, 1fr) 320px;
      gap: 14px;
      height: 100vh;
      padding: 14px;
    }

    .panel {
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 60px rgb(0 0 0 / 0.28);
      overflow: auto;
    }

    header {
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .provenance {
      margin-top: 8px;
      color: var(--accent-2);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .controls {
      display: grid;
      gap: 13px;
      padding: 14px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #0c1113;
      color: var(--ink);
      padding: 9px 10px;
    }

    input[type="range"] { padding: 0; accent-color: var(--accent); }

    .switches {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .switch {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      color: var(--ink);
      font-size: 13px;
      text-transform: none;
      letter-spacing: 0;
    }

    .switch input { width: auto; }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .stage {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }

    .canvas-wrap {
      display: grid;
      place-items: center;
      min-height: 0;
      padding: 16px;
      background:
        linear-gradient(90deg, rgb(255 255 255 / 0.035) 1px, transparent 1px),
        linear-gradient(rgb(255 255 255 / 0.035) 1px, transparent 1px),
        #0d1214;
      background-size: 32px 32px;
    }

    canvas {
      width: min(100%, 780px);
      aspect-ratio: 4 / 5;
      max-height: calc(100vh - 130px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f5f1e8;
      box-shadow: 0 28px 80px rgb(0 0 0 / 0.5);
    }

    .status {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 10px 14px 14px;
      border-top: 1px solid var(--line);
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      background: #11181b;
    }

    .metric strong {
      display: block;
      font-size: 18px;
      line-height: 1;
    }

    .metric span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .side {
      display: grid;
      grid-template-rows: auto minmax(140px, 1fr) minmax(180px, 1fr);
    }

    .section {
      padding: 14px;
      border-bottom: 1px solid var(--line);
      min-height: 0;
      overflow: auto;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 15px;
      letter-spacing: 0;
    }

    .history {
      display: grid;
      gap: 8px;
    }

    .history button {
      text-align: left;
      padding: 9px;
      font-weight: 600;
    }

    textarea {
      min-height: 148px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }

    .log {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .log div {
      border-left: 3px solid var(--accent);
      padding-left: 8px;
    }

    @media (max-width: 980px) {
      body { overflow: auto; }
      .app {
        grid-template-columns: 1fr;
        height: auto;
        min-height: 100vh;
      }
      canvas { max-height: none; }
      .side { grid-template-rows: auto; }
      .status { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel">
      <header>
        <h1>GPT-5 Tideprint Studio</h1>
        <div class="provenance">GPT-5 side-by-side</div>
      </header>
      <div class="controls">
        <div class="field">
          <label for="mode">Mode</label>
          <select id="mode">
            <option value="tidal">Tidal Topography</option>
            <option value="metro">Metro Signal Grid</option>
            <option value="spore">Spore Field</option>
            <option value="glyph">Glyph Weather</option>
          </select>
        </div>
        <div class="field">
          <label for="palette">Palette</label>
          <select id="palette">
            <option value="ink">Ink / Mint / Brass</option>
            <option value="safety">Safety Orange / Cyan</option>
            <option value="orchid">Orchid / Acid / Coal</option>
            <option value="paper">Paper / Moss / Brick</option>
          </select>
        </div>
        <div class="field">
          <label for="titleText">Title Text</label>
          <input id="titleText" value="TIDE SIGNAL 09">
        </div>
        <div class="field">
          <label for="seed">Seed</label>
          <input id="seed" type="number" value="4096" min="1" max="999999">
        </div>
        <div class="field">
          <label for="density">Density <span id="densityRead">62</span></label>
          <input id="density" type="range" min="10" max="100" value="62">
        </div>
        <div class="field">
          <label for="motion">Motion <span id="motionRead">35</span></label>
          <input id="motion" type="range" min="0" max="100" value="35">
        </div>
        <div class="field">
          <label>Layers</label>
          <div class="switches">
            <label class="switch"><input id="layerGrid" type="checkbox" checked> Grid</label>
            <label class="switch"><input id="layerInk" type="checkbox" checked> Ink</label>
            <label class="switch"><input id="layerMarks" type="checkbox" checked> Marks</label>
            <label class="switch"><input id="layerType" type="checkbox" checked> Type</label>
          </div>
        </div>
        <div class="button-grid">
          <button id="randomize" class="primary">Randomize</button>
          <button id="pause">Pause</button>
          <button id="undo">Undo</button>
          <button id="reset">Reset</button>
          <button id="exportPng" class="warn">Export PNG</button>
          <button id="exportJson">Export JSON</button>
        </div>
      </div>
    </section>

    <section class="panel stage">
      <div class="toolbar">
        <strong id="stateLabel">Live preview running</strong>
        <span id="downloadState">Exports are generated locally</span>
      </div>
      <div class="canvas-wrap">
        <canvas id="poster" width="900" height="1125"></canvas>
      </div>
      <div class="status">
        <div class="metric"><strong id="metricMode">Tidal</strong><span>mode</span></div>
        <div class="metric"><strong id="metricSeed">4096</strong><span>seed</span></div>
        <div class="metric"><strong id="metricMarks">0</strong><span>marks</span></div>
        <div class="metric"><strong id="metricFrame">0</strong><span>frame</span></div>
      </div>
    </section>

    <section class="panel side">
      <div class="section">
        <h2>Recent Presets</h2>
        <div id="history" class="history"></div>
      </div>
      <div class="section">
        <h2>Preset JSON</h2>
        <textarea id="presetText" spellcheck="false"></textarea>
      </div>
      <div class="section">
        <h2>Run Log</h2>
        <div id="log" class="log"></div>
      </div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const canvas = $("poster");
    const ctx = canvas.getContext("2d");
    const palettes = {
      ink: ["#f5f1e8", "#13221e", "#60d394", "#d8a84f", "#355b64"],
      safety: ["#101417", "#fff0cf", "#ff7a1a", "#40d9ff", "#222a32"],
      orchid: ["#17111f", "#f5eaff", "#c084fc", "#d9f76b", "#2a2033"],
      paper: ["#eee1c7", "#1d2d23", "#7b9d58", "#b94d36", "#d6b36d"]
    };
    const labels = { tidal: "Tidal", metro: "Metro", spore: "Spore", glyph: "Glyph" };
    const defaults = {
      mode: "tidal",
      palette: "ink",
      titleText: "TIDE SIGNAL 09",
      seed: 4096,
      density: 62,
      motion: 35,
      layerGrid: true,
      layerInk: true,
      layerMarks: true,
      layerType: true
    };
    let state = { ...defaults };
    let history = [];
    let logs = [];
    let frame = 0;
    let paused = false;
    let lastMarkCount = 0;

    function rng(seed) {
      let s = Number(seed) || 1;
      return () => {
        s = (s * 1664525 + 1013904223) >>> 0;
        return s / 4294967296;
      };
    }

    function readState() {
      state = {
        mode: $("mode").value,
        palette: $("palette").value,
        titleText: $("titleText").value || "UNTITLED SIGNAL",
        seed: Number($("seed").value) || 1,
        density: Number($("density").value),
        motion: Number($("motion").value),
        layerGrid: $("layerGrid").checked,
        layerInk: $("layerInk").checked,
        layerMarks: $("layerMarks").checked,
        layerType: $("layerType").checked
      };
      updateUi();
    }

    function writeState(next, record = true) {
      if (record) pushHistory();
      state = { ...state, ...next };
      $("mode").value = state.mode;
      $("palette").value = state.palette;
      $("titleText").value = state.titleText;
      $("seed").value = state.seed;
      $("density").value = state.density;
      $("motion").value = state.motion;
      $("layerGrid").checked = state.layerGrid;
      $("layerInk").checked = state.layerInk;
      $("layerMarks").checked = state.layerMarks;
      $("layerType").checked = state.layerType;
      updateUi();
      draw();
    }

    function pushHistory() {
      history.unshift({ ...state, savedAt: new Date().toLocaleTimeString() });
      history = history.slice(0, 6);
      renderHistory();
    }

    function log(message) {
      logs.unshift(`${new Date().toLocaleTimeString()} - ${message}`);
      logs = logs.slice(0, 8);
      $("log").innerHTML = logs.map((entry) => `<div>${entry}</div>`).join("");
    }

    function renderHistory() {
      $("history").innerHTML = history.map((item, index) => {
        const label = `${item.savedAt} · ${labels[item.mode]} · ${item.seed}`;
        return `<button type="button" data-history="${index}">${label}</button>`;
      }).join("") || "<span style='color: var(--muted)'>No presets captured yet.</span>";
      document.querySelectorAll("[data-history]").forEach((button) => {
        button.addEventListener("click", () => {
          const item = history[Number(button.dataset.history)];
          writeState(item, true);
          log(`Restored ${labels[item.mode]} preset ${item.seed}`);
        });
      });
    }

    function updateUi() {
      $("densityRead").textContent = state.density;
      $("motionRead").textContent = state.motion;
      $("metricMode").textContent = labels[state.mode];
      $("metricSeed").textContent = state.seed;
      $("metricMarks").textContent = lastMarkCount;
      $("metricFrame").textContent = frame;
      $("stateLabel").textContent = paused ? "Live preview paused" : "Live preview running";
      $("pause").textContent = paused ? "Resume" : "Pause";
      $("presetText").value = JSON.stringify(state, null, 2);
    }

    function background(pal) {
      ctx.fillStyle = pal[0];
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      if (!state.layerGrid) return;
      ctx.save();
      ctx.globalAlpha = 0.18;
      ctx.strokeStyle = pal[4];
      for (let x = 60; x < canvas.width; x += 60) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x + Math.sin(x * 0.02 + frame * 0.01) * 18, canvas.height);
        ctx.stroke();
      }
      for (let y = 75; y < canvas.height; y += 75) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y + Math.cos(y * 0.02 + frame * 0.01) * 18);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawTidal(rand, pal, count) {
      for (let i = 0; i < count; i += 1) {
        const y = 110 + i * (900 / count);
        const amp = 22 + rand() * 72;
        ctx.beginPath();
        for (let x = 60; x <= 840; x += 10) {
          const wave = Math.sin(x * 0.012 + i * 0.45 + frame * state.motion * 0.0009) * amp;
          const drift = Math.cos(x * 0.023 + state.seed) * amp * 0.25;
          if (x === 60) ctx.moveTo(x, y + wave + drift);
          else ctx.lineTo(x, y + wave + drift);
        }
        ctx.strokeStyle = i % 3 === 0 ? pal[2] : pal[1];
        ctx.globalAlpha = 0.2 + rand() * 0.5;
        ctx.lineWidth = 2 + rand() * 5;
        ctx.stroke();
      }
    }

    function drawMetro(rand, pal, count) {
      ctx.lineCap = "round";
      for (let i = 0; i < count; i += 1) {
        const sx = 80 + Math.floor(rand() * 12) * 62;
        const sy = 120 + Math.floor(rand() * 12) * 68;
        const steps = 2 + Math.floor(rand() * 5);
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        let x = sx;
        let y = sy;
        for (let j = 0; j < steps; j += 1) {
          x += (rand() > 0.5 ? 1 : -1) * (55 + rand() * 90);
          y += (rand() > 0.5 ? 1 : -1) * (50 + rand() * 88);
          ctx.lineTo(Math.max(60, Math.min(840, x)), Math.max(110, Math.min(960, y)));
        }
        ctx.strokeStyle = [pal[1], pal[2], pal[3]][i % 3];
        ctx.globalAlpha = 0.55;
        ctx.lineWidth = 4 + (i % 4);
        ctx.stroke();
        ctx.fillStyle = pal[3];
        ctx.globalAlpha = 0.8;
        ctx.beginPath();
        ctx.arc(x, y, 6 + (i % 3), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawSpore(rand, pal, count) {
      for (let i = 0; i < count * 2; i += 1) {
        const x = 70 + rand() * 760;
        const y = 110 + rand() * 830;
        const r = 8 + rand() * 42;
        const pulse = Math.sin(frame * 0.025 + i) * state.motion * 0.05;
        ctx.globalAlpha = 0.12 + rand() * 0.38;
        ctx.fillStyle = [pal[1], pal[2], pal[3]][i % 3];
        ctx.beginPath();
        ctx.arc(x, y, Math.max(3, r + pulse), 0, Math.PI * 2);
        ctx.fill();
        if (state.layerInk) {
          ctx.globalAlpha = 0.28;
          ctx.strokeStyle = pal[1];
          ctx.beginPath();
          ctx.arc(x, y, r * 1.7, 0, Math.PI * (1 + rand()));
          ctx.stroke();
        }
      }
    }

    function drawGlyph(rand, pal, count) {
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const glyphs = ["△", "□", "◇", "✕", "+", "○", "∿", "≋"];
      for (let i = 0; i < count * 2; i += 1) {
        const x = 90 + rand() * 720;
        const y = 130 + rand() * 800;
        const size = 20 + rand() * 58;
        ctx.globalAlpha = 0.28 + rand() * 0.55;
        ctx.fillStyle = [pal[1], pal[2], pal[3]][i % 3];
        ctx.font = `800 ${size}px Georgia, serif`;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rand() * Math.PI + frame * state.motion * 0.0005);
        ctx.fillText(glyphs[Math.floor(rand() * glyphs.length)], 0, 0);
        ctx.restore();
      }
    }

    function typeLayer(pal) {
      if (!state.layerType) return;
      ctx.save();
      ctx.globalAlpha = 0.92;
      ctx.fillStyle = pal[1];
      ctx.font = "900 66px Inter, system-ui, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(state.titleText.toUpperCase().slice(0, 22), 64, 1020);
      ctx.font = "700 24px Inter, system-ui, sans-serif";
      ctx.fillStyle = pal[4];
      ctx.fillText(`MODE ${labels[state.mode].toUpperCase()} / SEED ${state.seed} / GPT-5`, 66, 1062);
      ctx.fillStyle = pal[3];
      ctx.fillRect(64, 88, 142, 10);
      ctx.fillRect(694, 1014, 142, 10);
      ctx.restore();
    }

    function draw() {
      readState();
      const rand = rng(state.seed);
      const pal = palettes[state.palette];
      const count = Math.round(8 + state.density * 0.38);
      lastMarkCount = count;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      background(pal);
      if (state.layerInk) {
        ctx.globalCompositeOperation = "multiply";
        ctx.globalAlpha = 0.75;
        if (state.mode === "tidal") drawTidal(rand, pal, count);
        if (state.mode === "metro") drawMetro(rand, pal, count);
        if (state.mode === "spore") drawSpore(rand, pal, count);
        if (state.mode === "glyph") drawGlyph(rand, pal, count);
        ctx.globalCompositeOperation = "source-over";
      }
      if (state.layerMarks) {
        ctx.save();
        ctx.globalAlpha = 0.18;
        for (let i = 0; i < count * 5; i += 1) {
          ctx.fillStyle = i % 2 ? pal[1] : pal[3];
          ctx.fillRect(rand() * canvas.width, rand() * canvas.height, 1 + rand() * 3, 1 + rand() * 3);
        }
        ctx.restore();
      }
      typeLayer(pal);
      updateUi();
    }

    function tick() {
      if (!paused) {
        frame += 1;
        draw();
      }
      requestAnimationFrame(tick);
    }

    document.querySelectorAll("input, select").forEach((node) => {
      node.addEventListener("input", () => {
        readState();
        draw();
      });
      node.addEventListener("change", () => log(`Changed ${node.id || "control"}`));
    });

    $("randomize").addEventListener("click", () => {
      const modes = Object.keys(labels);
      const paletteNames = Object.keys(palettes);
      writeState({
        mode: modes[Math.floor(Math.random() * modes.length)],
        palette: paletteNames[Math.floor(Math.random() * paletteNames.length)],
        seed: Math.floor(1000 + Math.random() * 900000),
        density: Math.floor(25 + Math.random() * 72),
        motion: Math.floor(10 + Math.random() * 80)
      });
      log("Randomized preset");
    });

    $("pause").addEventListener("click", () => {
      paused = !paused;
      updateUi();
      log(paused ? "Paused live motion" : "Resumed live motion");
    });

    $("undo").addEventListener("click", () => {
      const item = history.shift();
      if (!item) return log("Undo requested with no history");
      renderHistory();
      writeState(item, false);
      log("Undo restored prior preset");
    });

    $("reset").addEventListener("click", () => {
      writeState(defaults);
      log("Reset to defaults");
    });

    $("exportPng").addEventListener("click", () => {
      const link = document.createElement("a");
      link.download = `gpt5-tideprint-${state.seed}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
      $("downloadState").textContent = "PNG export generated";
      log("Generated PNG data URL export");
    });

    $("exportJson").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.download = `gpt5-tideprint-${state.seed}.json`;
      link.href = URL.createObjectURL(blob);
      link.click();
      $("downloadState").textContent = "JSON export generated";
      log("Generated JSON preset export");
    });

    pushHistory();
    log("Studio initialized");
    draw();
    tick();
  </script>
</body>
</html>
